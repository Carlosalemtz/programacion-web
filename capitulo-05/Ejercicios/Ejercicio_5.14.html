<!DOCTYPE html>

<!-- Ejercicio 5.14: Galería con Zoom -->
<!-- Práctica de CSS3. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 5.14 - Galer&iacute;a con Zoom</title>
      <style type = "text/css">
         .galeria { display: flex; gap: 15px; padding: 20px; }
         .galeria img
         {
            width: 150px;
            height: 150px;
            object-fit: cover;
            transition: transform 0.3s ease;
         }
         .galeria img:hover { transform: scale(1.2); /* aumento del 20% */ }
      </style>
   </head>
   <body>
      <div class = "galeria">
         <img src = "Imagenes/atardecer.jpg" alt = "Atardecer en las monta&ntilde;as">
         <img src = "Imagenes/bosque.jpg" alt = "Bosque con niebla">
         <img src = "Imagenes/aurora.jpg" alt = "Aurora nocturna">
         <img src = "Imagenes/desierto.jpg" alt = "Dunas del desierto">
      </div>
   </body>
</html>
