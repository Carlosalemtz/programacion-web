<!DOCTYPE html>

<!-- Fig. 5.4: gradiente_lineal.html -->
<!-- Gradientes lineales en CSS3. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Gradiente Lineal</title>
      <style type = "text/css">
         div
         {
            width: 200px;
            height: 200px;
            border: 3px solid darkgreen;
            padding: 5px 20px;
            text-align: center;
            background: linear-gradient(to bottom, white 15%, khaki 50%, darkgreen 75%);
            float: left;
            margin-right: 15px;
         }
         #horizontal
         {
            border-color: crimson;
            background: linear-gradient(to right, white 15%, pink 50%, crimson 75%);
         }
         #diagonal
         {
            border-color: teal;
            background: linear-gradient(135deg, white 15%, aquamarine 50%, teal 75%);
         }
      </style>
   </head>
   <body>
      <div><h2>Gradiente Lineal Vertical</h2></div>
      <div id = "horizontal"><h2>Gradiente Lineal Horizontal</h2></div>
      <div id = "diagonal"><h2>Gradiente Lineal Diagonal</h2></div>
   </body>
</html>
