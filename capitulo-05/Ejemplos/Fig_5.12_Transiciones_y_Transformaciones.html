<!DOCTYPE html>

<!-- Fig. 5.12: transiciones.html -->
<!-- Transiciones y transformaciones en CSS3. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Transiciones</title>
      <style type = "text/css">
         img
         {
            margin: 80px;
            -webkit-transition: -webkit-transform 3s;
            transition: transform 3s;
         }
         img:hover
         {
            -webkit-transform: rotate(-360deg) scale(1.8, 1.8);
            transform: rotate(-360deg) scale(1.8, 1.8);
         }
      </style>
   </head>
   <body>
      <img src = "Imagenes/portada-html.png" width = "100" height = "131"
         alt = "Portada del libro HTML5 b&aacute;sico">
   </body>
</html>
