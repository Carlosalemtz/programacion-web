<!DOCTYPE html>

<!-- Fig. 5.2: esquinas_redondeadas.html -->
<!-- Uso de border-radius para agregar esquinas redondeadas a dos elementos. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Esquinas Redondeadas</title>
      <style type = "text/css">
         div
         {
            border: 3px solid darkgreen;
            padding: 5px 20px;
            background: honeydew;
            width: 220px;
            text-align: center;
            border-radius: 20px; /* agrega esquinas redondeadas */
            margin-bottom: 20px;
         }
         #redondo2
         {
            border-radius: 60px; /* aumenta el border-radius */
         }
      </style>
   </head>
   <body>
      <div>La propiedad border-radius agrega esquinas redondeadas a un elemento.</div>
      <div id = "redondo2">Si aumentamos el border-radius, las esquinas se ven todav&iacute;a m&aacute;s redondas.</div>
   </body>
</html>
