<!DOCTYPE html>

<!-- Fig. 5.7: trazo_texto.html -->
<!-- Trazo (contorno) de texto en CSS3. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Trazo de Texto</title>
      <style type = "text/css">
         h1
         {
            color: #ffe08a;
            -webkit-text-stroke: 2px #6a1b00; /* prefijo de proveedor */
            font-size: 500%; /* aumenta el tamaño de la fuente */
         }
      </style>
   </head>
   <body>
      <h1>Trazo de Texto</h1>
   </body>
</html>
