<!DOCTYPE html>

<!-- Fig. 5.13: inclinacion.html -->
<!-- Elementos de inclinación (skew) y transformación en CSS3. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Inclinar</title>
      <style type = "text/css">
         .skew .cuadro
         {
            margin-left: 75px;
            background: lightyellow;
            height: 100px;
            width: 200px;
            padding: 25px 0;
            text-align: center;
            font-size: 250%;
            border: 3px solid darkorange;
            border-radius: 15px;
            animation: inclinar 3s infinite linear;
         }
         @keyframes inclinar
         {
            from { transform: skewX(0deg); }
            25%  { transform: skewX(45deg); }
            50%  { transform: skewX(0); }
            75%  { transform: skewX(-45deg); }
            to   { transform: skewX(0); }
         }
      </style>
   </head>
   <body>
      <div class = "skew">
         <div class = "cuadro">Inclinar Texto</div>
      </div>
   </body>
</html>
