<!DOCTYPE html>

<!-- Ejercicio 7.23: Ejercicio_7.23_descifrar.html -->
<!-- Descifrar un entero de cuatro dígitos -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 7.23 - Descifrar un entero de cuatro dígitos</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 7.23: Descifrar un entero de cuatro dígitos</h1>
      <p class = "enunciado">Reciba un entero cifrado de cuatro dígitos (del ejercicio 7.22) y descífrelo para obtener el número original.</p>

      <script>
         var entrada = window.prompt( "Escriba el entero cifrado de cuatro dígitos:", "0189" );
         var numero = parseInt( entrada );

         while ( !( entrada.length == 4 && numero >= 0 && numero <= 9999 ) )
         {
            window.alert( "Debe escribir exactamente cuatro dígitos." );
            entrada = window.prompt( "Escriba el entero cifrado de cuatro dígitos:", "0189" );
            numero = parseInt( entrada );
         }

         // deshacer el intercambio (1o con 3o y 2o con 4o)
         var c1 = Math.floor( numero / 1000 );
         var c2 = Math.floor( numero / 100 ) % 10;
         var c3 = Math.floor( numero / 10 ) % 10;
         var c4 = numero % 10;

         // deshacer (dígito + 7) % 10 sumando 3 módulo 10
         var d1 = ( c3 + 3 ) % 10;
         var d2 = ( c4 + 3 ) % 10;
         var d3 = ( c1 + 3 ) % 10;
         var d4 = ( c2 + 3 ) % 10;

         document.writeln( "<p>Número cifrado: " + entrada + "</p>" );
         document.writeln( "<h2>Número original: " + d1 + d2 + d3 + d4 + "</h2>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
