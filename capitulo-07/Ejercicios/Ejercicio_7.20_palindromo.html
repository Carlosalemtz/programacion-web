<!DOCTYPE html>

<!-- Ejercicio 7.20: Ejercicio_7.20_palindromo.html -->
<!-- Palíndromo de cinco dígitos -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 7.20 - Palíndromo de cinco dígitos</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 7.20: Palíndromo de cinco dígitos</h1>
      <p class = "enunciado">Lea un entero de cinco dígitos y determine si es un palíndromo. Si el número no tiene cinco dígitos, muestre un diálogo alert y permita introducir un nuevo valor.</p>

      <script>
         var numero = parseInt( window.prompt( "Escriba un entero de cinco dígitos:", "12321" ) );

         while ( !( numero >= 10000 && numero <= 99999 ) )
         {
            window.alert( "El número debe tener exactamente cinco dígitos." );
            numero = parseInt( window.prompt( "Escriba un entero de cinco dígitos:", "12321" ) );
         } // fin de while

         // seleccionar cada dígito con división y residuo
         var d1 = Math.floor( numero / 10000 );
         var d2 = Math.floor( numero / 1000 ) % 10;
         var d4 = Math.floor( numero / 10 ) % 10;
         var d5 = numero % 10;

         if ( d1 == d5 && d2 == d4 )
            document.writeln( "<h2>" + numero + " es un palíndromo</h2>" );
         else
            document.writeln( "<h2>" + numero + " no es un palíndromo</h2>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
