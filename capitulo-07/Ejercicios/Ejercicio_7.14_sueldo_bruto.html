<!DOCTYPE html>

<!-- Ejercicio 7.14: Ejercicio_7.14_sueldo_bruto.html -->
<!-- Sueldo bruto de tres empleados -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 7.14 - Sueldo bruto de tres empleados</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 7.14: Sueldo bruto de tres empleados</h1>
      <p class = "enunciado">Determine el sueldo bruto de tres empleados: cuota normal en las primeras 40 horas y cuota y media en las horas que excedan de 40. Use diálogos prompt.</p>

      <script>
         var empleado = 1;
         var horas, tarifa, sueldo;

         document.writeln( "<table><tr><th>Empleado</th><th>Horas</th><th>Tarifa</th><th>Sueldo bruto</th></tr>" );

         while ( empleado <= 3 )
         {
            horas = parseFloat( window.prompt( "Horas trabajadas por el empleado " + empleado + ":", "40" ) );
            tarifa = parseFloat( window.prompt( "Tarifa por hora del empleado " + empleado + ":", "100" ) );

            if ( horas <= 40 )
               sueldo = horas * tarifa;
            else
               sueldo = 40 * tarifa + ( horas - 40 ) * tarifa * 1.5;

            document.writeln( "<tr><td>" + empleado + "</td><td>" + horas + "</td><td>$" +
               tarifa.toFixed( 2 ) + "</td><td>$" + sueldo.toFixed( 2 ) + "</td></tr>" );

            ++empleado;
         } // fin de while

         document.writeln( "</table>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
