<!DOCTYPE html>

<!-- Ejercicio 6.16: Ejercicio_6.16_operaciones_dos_numeros.html -->
<!-- Suma, producto, diferencia y cociente -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.16 - Suma, producto, diferencia y cociente</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 6.16: Suma, producto, diferencia y cociente</h1>
      <p class = "enunciado">Pida al usuario dos números y muestre la suma, el producto, la diferencia y el cociente.</p>

      <script>
         var numero1 = parseFloat( window.prompt( "Escriba el primer número", "0" ) );
         var numero2 = parseFloat( window.prompt( "Escriba el segundo número", "0" ) );

         document.writeln( "<h2>Números: " + numero1 + " y " + numero2 + "</h2>" );
         document.writeln( "<p>Suma: " + ( numero1 + numero2 ) + "</p>" );
         document.writeln( "<p>Producto: " + ( numero1 * numero2 ) + "</p>" );
         document.writeln( "<p>Diferencia: " + ( numero1 - numero2 ) + "</p>" );

         if ( numero2 != 0 )
            document.writeln( "<p>Cociente: " + ( numero1 / numero2 ) + "</p>" );
         if ( numero2 == 0 )
            document.writeln( "<p>Cociente: no se puede dividir entre cero</p>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
