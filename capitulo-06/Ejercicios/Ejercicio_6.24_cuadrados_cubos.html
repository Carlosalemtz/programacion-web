<!DOCTYPE html>

<!-- Ejercicio 6.24: Ejercicio_6.24_cuadrados_cubos.html -->
<!-- Cuadrados y cubos del 0 al 5 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.24 - Cuadrados y cubos del 0 al 5</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }
      td { text-align: center; }
      </style>
   </head>
   <body>
      <h1>Ejercicio 6.24: Cuadrados y cubos del 0 al 5</h1>
      <p class = "enunciado">Calcule los cuadrados y cubos de los números del 0 al 5 y muéstrelos en una tabla de HTML5 (no requiere entrada del usuario).</p>

      <script>
         document.writeln( "<table><tr><th>número</th><th>cuadrado</th><th>cubo</th></tr>" );
         document.writeln( "<tr><td>0</td><td>" + 0 * 0 + "</td><td>" + 0 * 0 * 0 + "</td></tr>" );
         document.writeln( "<tr><td>1</td><td>" + 1 * 1 + "</td><td>" + 1 * 1 * 1 + "</td></tr>" );
         document.writeln( "<tr><td>2</td><td>" + 2 * 2 + "</td><td>" + 2 * 2 * 2 + "</td></tr>" );
         document.writeln( "<tr><td>3</td><td>" + 3 * 3 + "</td><td>" + 3 * 3 * 3 + "</td></tr>" );
         document.writeln( "<tr><td>4</td><td>" + 4 * 4 + "</td><td>" + 4 * 4 * 4 + "</td></tr>" );
         document.writeln( "<tr><td>5</td><td>" + 5 * 5 + "</td><td>" + 5 * 5 * 5 + "</td></tr>" );
         document.writeln( "</table>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
