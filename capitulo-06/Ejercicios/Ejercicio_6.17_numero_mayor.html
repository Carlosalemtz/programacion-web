<!DOCTYPE html>

<!-- Ejercicio 6.17: Ejercicio_6.17_numero_mayor.html -->
<!-- ¿Cuál número es mayor? -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.17 - ¿Cuál número es mayor?</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 6.17: ¿Cuál número es mayor?</h1>
      <p class = "enunciado">Pida dos enteros y muestre en un diálogo de alerta el número mayor seguido de "es mayor que". Si son iguales, muestre en la página "Estos números son iguales".</p>

      <script>
         var numero1 = parseInt( window.prompt( "Escriba el primer entero", "0" ) );
         var numero2 = parseInt( window.prompt( "Escriba el segundo entero", "0" ) );

         if ( numero1 > numero2 )
            window.alert( numero1 + " es mayor que " + numero2 );

         if ( numero2 > numero1 )
            window.alert( numero2 + " es mayor que " + numero1 );

         if ( numero1 == numero2 )
            document.writeln( "<h2>Estos números son iguales</h2>" );

         document.writeln( "<p>Valores introducidos: " + numero1 + " y " + numero2 +
            ". Recargue la página para intentar de nuevo.</p>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
