<!DOCTYPE html>

<!-- Ejercicio 6.18: Ejercicio_6.18_tres_enteros.html -->
<!-- Suma, promedio, producto, menor y mayor -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.18 - Suma, promedio, producto, menor y mayor</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 6.18: Suma, promedio, producto, menor y mayor</h1>
      <p class = "enunciado">Reciba tres enteros y muestre la suma, el promedio, el producto, el menor y el mayor en un diálogo alert.</p>
      <p>Los resultados se muestran en un diálogo de alerta. Recargue la página para repetir.</p>
      <script>
         var a = parseInt( window.prompt( "Escriba el primer entero", "0" ) );
         var b = parseInt( window.prompt( "Escriba el segundo entero", "0" ) );
         var c = parseInt( window.prompt( "Escriba el tercer entero", "0" ) );

         var menor = a;
         var mayor = a;

         if ( b < menor ) menor = b;
         if ( c < menor ) menor = c;
         if ( b > mayor ) mayor = b;
         if ( c > mayor ) mayor = c;

         window.alert( "Números: " + a + ", " + b + ", " + c +
            "\nSuma: " + ( a + b + c ) +
            "\nPromedio: " + ( a + b + c ) / 3 +
            "\nProducto: " + ( a * b * c ) +
            "\nMenor: " + menor +
            "\nMayor: " + mayor );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
