<!DOCTYPE html>

<!-- Menor y mayor de cinco enteros -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.20 - Menor y mayor de cinco enteros</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 6.20: Menor y mayor de cinco enteros</h1>
      <p class = "enunciado">Lea cinco enteros y muestre el menor y el mayor del grupo (sólo con las técnicas de este capítulo).</p>

      <script>
         var n1 = parseInt( window.prompt( "Escriba el entero 1", "0" ) );
         var n2 = parseInt( window.prompt( "Escriba el entero 2", "0" ) );
         var n3 = parseInt( window.prompt( "Escriba el entero 3", "0" ) );
         var n4 = parseInt( window.prompt( "Escriba el entero 4", "0" ) );
         var n5 = parseInt( window.prompt( "Escriba el entero 5", "0" ) );

         var menor = n1;
         var mayor = n1;

         if ( n2 < menor ) menor = n2;
         if ( n3 < menor ) menor = n3;
         if ( n4 < menor ) menor = n4;
         if ( n5 < menor ) menor = n5;

         if ( n2 > mayor ) mayor = n2;
         if ( n3 > mayor ) mayor = n3;
         if ( n4 > mayor ) mayor = n4;
         if ( n5 > mayor ) mayor = n5;

         document.writeln( "<p>Números: " + n1 + ", " + n2 + ", " + n3 + ", " + n4 + ", " + n5 + "</p>" );
         document.writeln( "<h2>El menor es " + menor + "</h2>" );
         document.writeln( "<h2>El mayor es " + mayor + "</h2>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
