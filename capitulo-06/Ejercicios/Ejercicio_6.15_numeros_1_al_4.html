<!DOCTYPE html>

<!-- Ejercicio 6.15: Ejercicio_6.15_numeros_1_al_4.html -->
<!-- Números del 1 al 4 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.15 - Números del 1 al 4</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 6.15: Números del 1 al 4</h1>
      <p class = "enunciado">Muestre los números del 1 al 4 en la misma línea, separados por un espacio: a) con una instrucción document.writeln; b) con cuatro instrucciones document.write.</p>

      <script>
         // a) una sola instrucción document.writeln
         document.writeln( "<p><b>a)</b> 1 2 3 4</p>" );

         // b) cuatro instrucciones document.write
         document.write( "<p><b>b)</b> 1 " );
         document.write( "2 " );
         document.write( "3 " );
         document.write( "4</p>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
