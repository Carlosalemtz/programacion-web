<!DOCTYPE html>

<!-- Internet y World Wide Web: Cómo programar, 5ta ed., Deitel -->
<!-- Ejercicio 3.8 -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 3.8</title>
   </head>

   <body>
      <form method = "post" autocomplete = "on">
         <p><label for = "txtList">Días:
            <input type = "text" id = "txtList"
               placeholder = "Selecciona un día" list = "days" />
            <datalist id = "days">
               <option value = "Domingo">
               <option value = "Lunes">
               <option value = "Martes">
               <option value = "Miércoles">
               <option value = "Jueves">
               <option value = "Viernes">
               <option value = "Sábado">
            </datalist>
         </label></p>
         <p>
            <input type = "submit" value = "Enviar">
            <input type = "reset" value = "Limpiar">
         </p>
      </form>
   </body>
</html>
