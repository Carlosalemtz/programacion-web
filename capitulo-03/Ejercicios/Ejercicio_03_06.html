   <body>
      <h1>Formulario de registro</h1>

      <form method = "post" action = "aminukano585@gmail.com" autocomplete = "on">
         <input type = "hidden" name = "recipient"
            value = "aminukano585@gmail.com">
         <input type = "hidden" name = "subject"
            value = "Formulario de registro">
         <input type = "hidden" name = "redirect"
            value = "exe03-06.html">

         <!-- Los siguientes input insertan campos de texto -->
         <p><label>Nombre:
            <input type = "text" id = "firstName"
               placeholder = "Escribe aquí tu nombre">
            </label>
         </p>

         <p><label>Apellido:
            <input type = "text" id = "lastName"
               placeholder = "Escribe aquí tu apellido">
            </label>
         </p>

         <p><label>Correo electrónico:
            <input type = "email" id = "email"
               placeholder = "Escribe aquí tu correo electrónico">
            </label>
         </p>

         <details>
            <summary>Pregunta opcional de la encuesta</summary>
            <p>
               <strong>¿En qué año de la universidad estás actualmente?</strong><br>
               <label>Primer año
                  <input name = "year" type = "radio" value = "freshman"
                     checked></label>
               <label>Segundo año
                  <input name = "year" type = "radio" value = "sophomore"></label>
               <label>Penúltimo año
                  <input name = "year" type = "radio" value = "penultimate"></label>
               <label>Último año
                  <input name = "year" type = "radio" value = "final"></label>
            </p>
         </details>

         <p>
            <input type = "submit" value = "Enviar">
            <input type = "reset" value = "Limpiar">
         </p>
      </form>
   </body>
