<!DOCTYPE html>

<!-- Fig. 4.1: Fig_4.1_EstilosInline.html -->
<!-- Uso de estilos en línea -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Estilos en línea</title>
   </head>
   <body>
      <p>Este texto no tiene ningún estilo aplicado.</p>

      <!-- El atributo style permite declarar estilos en línea. -->
      <!-- Se deben separar varias propiedades de estilo con -->
      <!-- un punto y coma. -->
      <p style = "font-size: 20pt;">Este texto tiene aplicado el
         estilo <em>font-size</em>, lo que lo hace de 20pt.
      </p>

      <p style = "font-size: 20pt; color: deepskyblue;">
         Este texto tiene aplicados los estilos <em>font-size</em> y
         <em>color</em>, lo que lo hace de 20pt y azul cielo profundo.</p>
   </body>
</html>
