<!DOCTYPE html>

<!-- Fig. 4.10: Fig_4.10_Posicionamiento2.html -->
<!-- Posicionamiento relativo de elementos. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Posicionamiento relativo</title>
      <style type = "text/css">
         p           { font-size: 1.3em;
                       font-family: verdana, arial, sans-serif; }
         span        { color: red;
                       font-size: .6em;
                       height: 1em; }
         .super      { position: relative;
                       top: -1ex; }
         .sub        { position: relative;
                       bottom: -1ex; }
         .shiftleft  { position: relative;
                       left: -1ex; }
         .shiftright { position: relative;
                       right: -1ex; }
      </style>
   </head>
   <body>
      <p>El texto al final de esta oración
         <span class = "super">está en superíndice</span>.</p>

      <p>El texto al final de esta oración
         <span class = "sub">está en subíndice</span>.</p>

      <p>El texto al final de esta oración
         <span class = "shiftleft">está desplazado a la izquierda</span>.</p>

      <p>El texto al final de esta oración
         <span class = "shiftright">está desplazado a la derecha</span>.</p>
   </body>
</html>
