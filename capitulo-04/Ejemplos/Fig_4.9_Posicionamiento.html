<!DOCTYPE html>

<!-- Fig 4.9: Fig_4.9_Posicionamiento.html -->
<!-- Posicionamiento absoluto de elementos. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Posicionamiento absoluto</title>
      <style type = "text/css">
      .imagen_fondo   { position: absolute;
                 top: 0px;
                 left: 0px;
                 z-index: 1; }
      .imagen_frente   { position: absolute;
                 top: 25px;
                 left: 100px;
                 z-index: 2; }
      .texto    { position: absolute;
                 top: 25px;
                 left: 100px;
                 z-index: 3;
                 font-size: 20pt;
                 font-family: tahoma, geneva, sans-serif; }
      </style>
   </head>
   <body>
      <p><img src = "Imagenes/background_image.png" class = "imagen_fondo"
         alt = "Primera imagen posicionada" /></p>

      <p><img src = "Imagenes/foreground_image.png" class = "imagen_frente"
         alt = "Segunda imagen posicionada" /></p>

      <p class = "texto">Texto posicionado</p>
   </body>
</html>
