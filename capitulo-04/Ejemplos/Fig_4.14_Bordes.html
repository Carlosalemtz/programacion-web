<!DOCTYPE html>

<!-- Fig. 4.14: Fig_4.14_Bordes.html -->
<!-- Bordes de elementos de bloque. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Bordes</title>
      <style type = "text/css">
         div     { text-align: center;
                   width: 50%;
                   position: relative;
                   left: 25%;
                   border-width: 6px; }
         .thick  { border-width: thick; }
         .medium { border-width: medium; }
         .thin   { border-width: thin; }
         .solid  { border-style: solid; }
         .double { border-style: double; }
         .groove { border-style: groove; }
         .ridge  { border-style: ridge; }
         .dotted { border-style: dotted; }
         .inset  { border-style: inset; }
         .outset { border-style: outset; }
         .dashed { border-style: dashed; }
         .red    { border-color: red; }
         .blue   { border-color: blue; }
      </style>
   </head>
   <body>
      <div class = "solid">Borde sólido</div><hr>
      <div class = "double">Borde doble</div><hr>
      <div class = "groove">Borde en ranura (groove)</div><hr>
      <div class = "ridge">Borde en resalte (ridge)</div><hr>
      <div class = "dotted">Borde punteado</div><hr>
      <div class = "inset">Borde hundido (inset)</div><hr>
      <div class = "thick dashed">Borde discontinuo grueso</div><hr>
      <div class = "thin red solid">Borde sólido rojo delgado</div><hr>
      <div class = "medium blue outset">Borde saliente azul mediano</div>
   </body>
</html>
