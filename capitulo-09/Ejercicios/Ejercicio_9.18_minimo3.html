<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.18 - Función minimo3</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.18: Función minimo3</h1>
      <p class = "enunciado">Escriba la función minimo3 que devuelva el menor de tres números de punto flotante usando Math.min. Lea tres valores del usuario y determine el más pequeño.</p>

      <script>
         function minimo3( a, b, c )
         {
            return Math.min( a, Math.min( b, c ) );
         } // fin de la función minimo3

         var v1 = parseFloat( window.prompt( "Escriba el primer número", "0" ) );
         var v2 = parseFloat( window.prompt( "Escriba el segundo número", "0" ) );
         var v3 = parseFloat( window.prompt( "Escriba el tercer número", "0" ) );

         document.writeln( "<p>Números: " + v1 + ", " + v2 + ", " + v3 + "</p>" );
         document.writeln( "<h2>El menor es " + minimo3( v1, v2, v3 ) + "</h2>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
