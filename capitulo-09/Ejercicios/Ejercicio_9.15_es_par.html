<!DOCTYPE html>

<!-- Ejercicio 9.15: Ejercicio_9.15_es_par.html -->
<!-- Función esPar -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.15 - Función esPar</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.15: Función esPar</h1>
      <p class = "enunciado">Reciba enteros uno a la vez con un diálogo prompt y páselos a la función esPar, que usa el operador módulo para determinar si el entero es par. Use un ciclo controlado por centinela (escriba -1 para terminar).</p>

      <script>
         function esPar( numero )
         {
            return numero % 2 == 0;
         } // fin de la función esPar

         var numero = parseInt( window.prompt( "Escriba un entero (-1 para terminar):", "-1" ) );

         while ( numero != -1 )
         {
            document.writeln( "<p>" + numero + ( esPar( numero ) ? " es par" : " es impar" ) + "</p>" );
            numero = parseInt( window.prompt( "Escriba un entero (-1 para terminar):", "-1" ) );
         } // fin de while

         document.writeln( "<p><i>Fin.</i></p>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
