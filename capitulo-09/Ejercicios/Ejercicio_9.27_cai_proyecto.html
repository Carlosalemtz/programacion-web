<!DOCTYPE html>

<!-- Ejercicio 9.27: Ejercicio_9.27_cai_proyecto.html -->
<!-- Proyecto CAI: nivel y tipo de problema -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.27 - Proyecto CAI: nivel y tipo de problema</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.27: Proyecto CAI: nivel y tipo de problema</h1>
      <p class = "enunciado">a) Permita elegir el nivel de grado (1 = números de un dígito, 2 = hasta dos dígitos, etc.). b) Permita elegir el tipo de problema: 1 suma, 2 resta, 3 multiplicación, 4 división, 5 mezcla aleatoria.</p>
      <form action = "#">
         <p><label>Nivel de grado:
            <select id = "nivel">
               <option value = "1">1 (un dígito)</option>
               <option value = "2">2 (hasta dos dígitos)</option>
               <option value = "3">3 (hasta tres dígitos)</option>
            </select></label>
            <label>Tipo de problema:
            <select id = "tipo">
               <option value = "1">1 - Suma</option>
               <option value = "2">2 - Resta</option>
               <option value = "3" selected>3 - Multiplicación</option>
               <option value = "4">4 - División</option>
               <option value = "5">5 - Mezcla</option>
            </select></label>
            <input id = "botonIniciar" type = "button" value = "Nueva pregunta"></p>
      </form>
      <p id = "pregunta" style = "font-size: 1.6em; font-weight: bold"></p>
      <form action = "#" id = "formulario">
         <p><input id = "respuesta" type = "number">
            <input id = "botonResponder" type = "submit" value = "Responder"></p>
      </form>
      <p id = "mensaje" style = "font-size: 1.3em"></p>
      <p id = "marcador"></p>
      <script>
         var resultadoCorrecto;
         var correctas = 0, incorrectas = 0;
         function respuestaCorrecta()
         {
            switch ( 1 + Math.floor( Math.random() * 4 ) )
            {
               case 1: return "¡Muy bien!";
               case 2: return "¡Excelente!";
               case 3: return "¡Buen trabajo!";
               default: return "¡Siga así!";
            }
         } // fin de la función respuestaCorrecta

         function respuestaIncorrecta()
         {
            switch ( 1 + Math.floor( Math.random() * 4 ) )
            {
               case 1: return "No. Intente de nuevo.";
               case 2: return "Equivocado. Trate una vez más.";
               case 3: return "No se dé por vencido.";
               default: return "No. Siga intentando.";
            }
         } // fin de la función respuestaIncorrecta

         // número aleatorio según el nivel de grado (1 a 10^nivel - 1)
         function numeroAleatorio( nivel )
         {
            var maximo = Math.pow( 10, nivel ) - 1;
            return 1 + Math.floor( Math.random() * maximo );
         }

         function generarPregunta()
         {
            var nivel = parseInt( document.getElementById( "nivel" ).value );
            var tipo = parseInt( document.getElementById( "tipo" ).value );
            var a = numeroAleatorio( nivel );
            var b = numeroAleatorio( nivel );
            var operador;

            if ( tipo == 5 )
               tipo = 1 + Math.floor( Math.random() * 4 );

            switch ( tipo )
            {
               case 1:
                  operador = "más";
                  resultadoCorrecto = a + b;
                  break;
               case 2:
                  if ( b > a ) { var t = a; a = b; b = t; } // evitar resultados negativos
                  operador = "menos";
                  resultadoCorrecto = a - b;
                  break;
               case 3:
                  operador = "por";
                  resultadoCorrecto = a * b;
                  break;
               case 4:
                  a = a * b; // así la división es exacta
                  operador = "entre";
                  resultadoCorrecto = a / b;
                  break;
            }

            document.getElementById( "pregunta" ).innerHTML = "¿Cuánto es " + a + " " + operador + " " + b + "?";
            document.getElementById( "respuesta" ).value = "";
            document.getElementById( "respuesta" ).focus();
         } // fin de la función generarPregunta

         function verificar( evento )
         {
            evento.preventDefault();
            var respuesta = parseInt( document.getElementById( "respuesta" ).value );
            var mensaje = document.getElementById( "mensaje" );

            if ( respuesta == resultadoCorrecto )
            {
               ++correctas;
               mensaje.innerHTML = respuestaCorrecta();
               mensaje.style.color = "green";
               generarPregunta();
            }
            else
            {
               ++incorrectas;
               mensaje.innerHTML = respuestaIncorrecta();
               mensaje.style.color = "red";
               document.getElementById( "respuesta" ).select();
            }

            document.getElementById( "marcador" ).innerHTML =
               "Correctas: " + correctas + " &nbsp; Incorrectas: " + incorrectas;
         } // fin de la función verificar

         document.getElementById( "formulario" ).addEventListener( "submit", verificar, false );
         document.getElementById( "botonIniciar" ).addEventListener( "click", generarPregunta, false );
         generarPregunta();
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
