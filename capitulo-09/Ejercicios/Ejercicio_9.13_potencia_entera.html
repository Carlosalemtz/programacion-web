<!DOCTYPE html>

<!-- Ejercicio 9.13: Ejercicio_9.13_potencia_entera.html -->
<!-- Función potenciaEntera -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.13 - Función potenciaEntera</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.13: Función potenciaEntera</h1>
      <p class = "enunciado">Escriba la función potenciaEntera( base, exponente ) que devuelva base<sup>exponente</sup> usando un ciclo. El formulario tiene dos campos de texto y un botón.</p>
      <form action = "#">
         <p><label>Base: <input id = "base" type = "text" value = "3"></label>
            <label>Exponente: <input id = "exponente" type = "text" value = "4"></label>
            <input id = "botonCalcular" type = "button" value = "Calcular"></p>
      </form>
      <p id = "resultado"></p>
      <script>
         function potenciaEntera( base, exponente )
         {
            var resultado = 1;

            for ( var i = 1; i <= exponente; ++i )
               resultado *= base;

            return resultado;
         } // fin de la función potenciaEntera

         function calcular()
         {
            var base = parseInt( document.getElementById( "base" ).value );
            var exponente = parseInt( document.getElementById( "exponente" ).value );

            if ( isNaN( base ) || isNaN( exponente ) || exponente < 0 )
               document.getElementById( "resultado" ).innerHTML = "Escriba una base entera y un exponente entero positivo.";
            else
               document.getElementById( "resultado" ).innerHTML =
                  base + "<sup>" + exponente + "</sup> = " + potenciaEntera( base, exponente );
         } // fin de la función calcular

         document.getElementById( "botonCalcular" ).addEventListener( "click", calcular, false );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
