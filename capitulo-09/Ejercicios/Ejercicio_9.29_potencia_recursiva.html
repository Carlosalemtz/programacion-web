<!DOCTYPE html>

<!-- Ejercicio 9.29: Ejercicio_9.29_potencia_recursiva.html -->
<!-- Función potencia recursiva -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.29 - Función potencia recursiva</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.29: Función potencia recursiva</h1>
      <p class = "enunciado">Escriba la función recursiva potencia( base, exponente ) que devuelva base<sup>exponente</sup>, usando base<sup>exponente</sup> = base × base<sup>exponente−1</sup> y la condición de terminación exponente = 1. El usuario introduce la base y el exponente.</p>
      <form action = "#">
         <p><label>Base: <input id = "base" type = "number" value = "3"></label>
            <label>Exponente (≥ 1): <input id = "exponente" type = "number" min = "1" value = "4"></label>
            <input id = "botonCalcular" type = "button" value = "Calcular"></p>
      </form>
      <p id = "resultado"></p>
      <script>
         function potencia( base, exponente )
         {
            if ( exponente == 1 ) // caso base
               return base;
            else                   // paso de recursividad
               return base * potencia( base, exponente - 1 );
         } // fin de la función potencia

         document.getElementById( "botonCalcular" ).addEventListener( "click", function()
         {
            var base = parseInt( document.getElementById( "base" ).value );
            var exponente = parseInt( document.getElementById( "exponente" ).value );

            if ( isNaN( base ) || isNaN( exponente ) || exponente < 1 )
               document.getElementById( "resultado" ).innerHTML = "El exponente debe ser un entero mayor o igual a 1.";
            else
               document.getElementById( "resultado" ).innerHTML =
                  "potencia( " + base + ", " + exponente + " ) = " + potencia( base, exponente );
         }, false );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
