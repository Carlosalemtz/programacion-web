<!DOCTYPE html>

<!-- Ejercicio 9.17: Ejercicio_9.17_temperaturas.html -->
<!-- Conversión de temperaturas -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.17 - Conversión de temperaturas</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.17: Conversión de temperaturas</h1>
      <p class = "enunciado">Implemente las funciones celsius (C = 5/9 × (F − 32)) y fahrenheit (F = 9/5 × C + 32). El documento tiene dos botones: uno para convertir de Fahrenheit a Celsius y otro de Celsius a Fahrenheit.</p>
      <form action = "#">
         <p><label>Temperatura: <input id = "temperatura" type = "number" step = "any" value = "100"></label></p>
         <p><input id = "aCelsius" type = "button" value = "Fahrenheit → Celsius">
            <input id = "aFahrenheit" type = "button" value = "Celsius → Fahrenheit"></p>
      </form>
      <p id = "resultado"></p>
      <script>
         function celsius( f )
         {
            return 5.0 / 9.0 * ( f - 32 );
         }

         function fahrenheit( c )
         {
            return 9.0 / 5.0 * c + 32;
         }

         function leer()
         {
            return parseFloat( document.getElementById( "temperatura" ).value );
         }

         document.getElementById( "aCelsius" ).addEventListener( "click", function()
         {
            var t = leer();
            document.getElementById( "resultado" ).innerHTML = t + " °F = " + celsius( t ).toFixed( 2 ) + " °C";
         }, false );

         document.getElementById( "aFahrenheit" ).addEventListener( "click", function()
         {
            var t = leer();
            document.getElementById( "resultado" ).innerHTML = t + " °C = " + fahrenheit( t ).toFixed( 2 ) + " °F";
         }, false );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
