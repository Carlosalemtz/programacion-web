<!DOCTYPE html>

<!-- Ejercicio 9.7: Ejercicio_9.7_area_circulo.html -->
<!-- Área de un círculo -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.7 - Área de un círculo</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.7: Área de un círculo</h1>
      <p class = "enunciado">Use un formulario para obtener el radio de un círculo y llame a la función areaCirculo para calcular el área; muestre el resultado en un párrafo.</p>
      <form action = "#">
         <p><label>Radio: <input id = "campoRadio" type = "number" step = "any"></label>
            <input id = "botonCalcular" type = "button" value = "Calcular"></p>
      </form>
      <p id = "resultado"></p>
      <script>
         function iniciar()
         {
            var boton = document.getElementById( "botonCalcular" );
            boton.addEventListener( "click", mostrarArea, false );
         } // fin de la función iniciar

         function mostrarArea()
         {
            var radio = parseFloat( document.getElementById( "campoRadio" ).value );
            var resultado = document.getElementById( "resultado" );

            if ( isNaN( radio ) )
               resultado.innerHTML = "Escriba un radio válido.";
            else
               resultado.innerHTML = "El área del círculo es: " + areaCirculo( radio ).toFixed( 4 );
         } // fin de la función mostrarArea

         function areaCirculo( radio )
         {
            return Math.PI * radio * radio;
         } // fin de la función areaCirculo

         iniciar();
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
