<!DOCTYPE html>

<!-- Ejercicio 9.9: Ejercicio_9.9_distancia.html -->
<!-- Distancia entre dos puntos -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 9.9 - Distancia entre dos puntos</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 9.9: Distancia entre dos puntos</h1>
      <p class = "enunciado">Escriba la función distancia que calcule la distancia entre (x1, y1) y (x2, y2). El usuario introduce las coordenadas con un formulario.</p>
      <form action = "#">
         <p>Punto 1: x1 <input id = "x1" type = "number" step = "any" value = "0">
            y1 <input id = "y1" type = "number" step = "any" value = "0"></p>
         <p>Punto 2: x2 <input id = "x2" type = "number" step = "any" value = "3">
            y2 <input id = "y2" type = "number" step = "any" value = "4"></p>
         <p><input id = "botonCalcular" type = "button" value = "Calcular distancia"></p>
      </form>
      <p id = "resultado"></p>
      <script>
         function distancia( x1, y1, x2, y2 )
         {
            return Math.sqrt( Math.pow( x2 - x1, 2 ) + Math.pow( y2 - y1, 2 ) );
         } // fin de la función distancia

         function valor( id )
         {
            return parseFloat( document.getElementById( id ).value );
         }

         function mostrarDistancia()
         {
            var d = distancia( valor( "x1" ), valor( "y1" ), valor( "x2" ), valor( "y2" ) );
            document.getElementById( "resultado" ).innerHTML = "La distancia es: " + d;
         } // fin de la función mostrarDistancia

         document.getElementById( "botonCalcular" ).addEventListener( "click", mostrarDistancia, false );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
