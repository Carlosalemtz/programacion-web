<!DOCTYPE html>

<!-- Ejercicio 2.13: clasifique cada objeto de HTML5 como elemento o atributo -->
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 2.13</title>
    </head>

    <body>
        <h1>Ejercicio 2.13 - Elemento o atributo</h1>

        <p>Clasifique cada uno de los siguientes objetos como elemento o atributo:</p>

        <table border = "1">
            <thead>
                <tr>
                    <th>Objeto</th>
                    <th>Respuesta</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>a) width</td><td>Atributo</td></tr>
                <tr><td>b) td</td><td>Elemento</td></tr>
                <tr><td>c) th</td><td>Elemento</td></tr>
                <tr><td>d) name</td><td>Atributo</td></tr>
                <tr><td>e) select</td><td>Elemento</td></tr>
                <tr><td>f) type</td><td>Atributo</td></tr>
            </tbody>
        </table>
    </body>
</html>
