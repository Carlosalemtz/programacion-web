<!DOCTYPE html>

<!-- Ejercicio 2.4: transformaciones de tamaño de imagen -->
<!-- deitel.png mide originalmente 200 x 150 pixeles -->
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 2.4</title>
    </head>

    <body>
        <h1>Transformaciones de la imagen deitel.png (200 x 150 original)</h1>

        <!-- a) Aumentar el tamaño de la imagen en un 100% (el doble) -->
        <p>a) Aumento del 100%:</p>
        <img src = "Imagenes/Cristiano 1.jpeg" width = "400" height = "300" alt = "Cristiano Ronaldo al doble de tamaño">

        <!-- b) Aumentar el tamaño de la imagen en un 50% -->
        <p>b) Aumento del 50%:</p>
        <img src = "Imagenes/Cristiano 2.jpg" width = "300" height = "225" alt = "Cristiano Ronaldo al 150% de tamaño">

        <!-- c) Cambiar la relación anchura-altura a 2:1 manteniendo el -->
        <!-- valor de width que se obtuvo en el inciso a) (400) -->
        <p>c) Relación 2:1 manteniendo el width del inciso a):</p>
        <img src = "Imagenes/Cristiano 3.jpg" width = "400" height = "200" alt = "Cristiano Ronaldo con relación 2 a 1">
    </body>
</html>
