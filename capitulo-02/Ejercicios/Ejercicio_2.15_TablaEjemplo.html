<!DOCTYPE html>

<!-- Ejercicio 2.15: tabla de ejemplo con encabezado, cuerpo y pie -->
<html>
    <head>
        <meta charset="UTF-8">
        <title>Solución 18</title>
    </head>

    <body>
        <h1>Página de ejemplo de tabla</h1>

        <p>Esta es una tabla de muestra pequeña.</p>

        <table border = "1">
            <thead>
                <tr>
                    <th>Encabezado de la tabla</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Este es el cuerpo de la tabla</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td>Este es el pie de la tabla</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
