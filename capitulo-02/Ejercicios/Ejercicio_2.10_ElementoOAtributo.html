<!DOCTYPE html>

<!-- Ejercicio 2.10: identifique cada objeto de HTML5 como elemento o atributo -->
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 2.10</title>
    </head>

    <body>
        <h1>Ejercicio 2.10 - Elemento o atributo</h1>

        <p>Identifique cada uno de los siguientes objetos de HTML5 como un elemento o un atributo:</p>

        <table border = "1">
            <thead>
                <tr>
                    <th>Objeto</th>
                    <th>Respuesta</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>a) html</td><td>Elemento</td></tr>
                <tr><td>b) width</td><td>Atributo</td></tr>
                <tr><td>c) href</td><td>Atributo</td></tr>
                <tr><td>d) br</td><td>Elemento</td></tr>
                <tr><td>e) h3</td><td>Elemento</td></tr>
                <tr><td>f) p</td><td>Elemento</td></tr>
                <tr><td>g) src</td><td>Atributo</td></tr>
            </tbody>
        </table>
    </body>
</html>
