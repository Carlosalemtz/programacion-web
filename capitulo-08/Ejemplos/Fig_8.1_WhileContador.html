<!DOCTYPE html>

<!-- Fig. 8.1: Fig_8.1_WhileContador.html -->
<!-- Repetición controlada por un contador. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Repetición controlada por un contador</title>
      <script>

         var contador = 1; // inicialización

         while ( contador <= 7 ) // condición de repetición
         {
            document.writeln( "<p style = 'font-size: " +
               contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );
            ++contador; // incremento
         } // fin de while

      </script>
   </head><body></body>
</html>
