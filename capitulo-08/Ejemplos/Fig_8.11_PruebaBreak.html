<!DOCTYPE html>

<!-- Fig. 8.11: Fig_8.11_PruebaBreak.html -->
<!-- Uso de la instrucción break en una instrucción for. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>
         Uso de la instrucción break en una instrucción for
      </title>
      <script>

         for ( var cuenta = 1; cuenta <= 10; ++cuenta )
         {
            if ( cuenta == 5 )
               break; // sale del ciclo sólo si cuenta == 5

            document.writeln( cuenta + " " );
         } // fin de for

         document.writeln(
            "<p>Se interrumpió el ciclo en cuenta = " + cuenta + "</p>" );

      </script>
   </head><body></body>
</html>
