<!DOCTYPE html>

<!-- Ejercicio 8.6: Ejercicio_8.6_menor_de_varios.html -->
<!-- El menor de varios enteros -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 8.6 - El menor de varios enteros</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }

      </style>
   </head>
   <body>
      <h1>Ejercicio 8.6: El menor de varios enteros</h1>
      <p class = "enunciado">Encuentre el menor de varios enteros no negativos. El primer valor leído especifica cuántos valores introducirá el usuario.</p>

      <script>
         var cantidad = parseInt( window.prompt( "¿Cuántos valores va a introducir?", "3" ) );
         var menor;
         var valor;

         if ( cantidad > 0 )
         {
            for ( var i = 1; i <= cantidad; ++i )
            {
               valor = parseInt( window.prompt( "Escriba el valor " + i + " de " + cantidad + ":", "0" ) );

               if ( i == 1 || valor < menor )
                  menor = valor;
            } // fin de for

            document.writeln( "<h2>El menor de los " + cantidad + " valores es " + menor + "</h2>" );
         }
         else
            document.writeln( "<p>No se introdujeron valores.</p>" );
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
