<!DOCTYPE html>

<!-- Ejercicio 8.9: Ejercicio_8.9_histograma.html -->
<!-- Gráfico de barras (histograma) -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 8.9 - Gráfico de barras (histograma)</title>
      <style type = "text/css">
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; }
      h1 { color: #1f3c88; font-size: 1.6em; margin-bottom: 4px; }
      .enunciado { background: #eef3ff; border-left: 5px solid #1f3c88; padding: 10px 14px; margin: 10px 0 18px; }
      .respuesta { background: #f6fff2; border-left: 5px solid #2e8b57; padding: 8px 14px; margin: 8px 0; }
      code, pre { font-family: Consolas, "Courier New", monospace; background: #f4f4f4; }
      pre { padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
      table { border-collapse: collapse; margin: 10px 0; }
      th, td { border: 1px solid #999; padding: 4px 12px; }
      th { background: #1f3c88; color: white; }
      input, button { font-size: 1em; padding: 4px 8px; margin: 4px 2px; }
      a.regresar { display: inline-block; margin-top: 20px; }
      .barra { font-family: monospace; font-size: 1.2em; margin: 4px 0; color: #1f3c88; }
      .barra span { display: inline-block; width: 40px; color: #222; }
      </style>
   </head>
   <body>
      <h1>Ejercicio 8.9: Gráfico de barras (histograma)</h1>
      <p class = "enunciado">Lea cinco números entre 1 y 30. Por cada número, muestre una línea con el mismo número de asteriscos adyacentes.</p>

      <script>
         var numero;

         for ( var i = 1; i <= 5; ++i )
         {
            do {
               numero = parseInt( window.prompt( "Escriba el número " + i + " (entre 1 y 30):", "10" ) );

               if ( !( numero >= 1 && numero <= 30 ) )
                  window.alert( "El número debe estar entre 1 y 30" );
            } while ( !( numero >= 1 && numero <= 30 ) );

            var barra = "";

            for ( var j = 1; j <= numero; ++j )
               barra += "*";

            document.writeln( "<p class = 'barra'><span>" + numero + "</span>" + barra + "</p>" );
         } // fin de for
      </script>
      <p><a class = "regresar" href = "../index.html">&larr; Regresar al índice</a></p>
   </body>
</html>
